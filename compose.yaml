name: anchor-circle
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: anchor_circle, POSTGRES_USER: anchor, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-anchor_change_me}" }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U anchor -d anchor_circle"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20 }
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    volumes: ["./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro"]
    ports: ["1935:1935", "8888:8888"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://anchor:${POSTGRES_PASSWORD:-anchor_change_me}@postgres:5432/anchor_circle"
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/data/uploads
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-change-this-access-secret-at-least-32-characters}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-this-refresh-secret-at-least-32-characters}"
    volumes: [uploads:/app/data/uploads]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -qO-, http://localhost:3000/api/health], interval: 10s, timeout: 5s, retries: 20 }
  mobile-web:
    build: { context: ., dockerfile: apps/mobile-web/Dockerfile }
    restart: unless-stopped
  admin-web:
    build: { context: ., dockerfile: apps/admin-web/Dockerfile }
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: { api: { condition: service_healthy }, mobile-web: { condition: service_started }, admin-web: { condition: service_started } }
    healthcheck: { test: [CMD, wget, -qO-, http://localhost/health], interval: 10s, timeout: 5s, retries: 10 }
volumes: { postgres_data: {}, redis_data: {}, uploads: {} }
