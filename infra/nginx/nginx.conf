events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api { server api:3000; } upstream mobile { server mobile-web:80; } upstream admin { server admin-web:80; }
  server {
    listen 80; client_max_body_size 11m;
    location = /health { return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /socket.io/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
    location /admin/ { proxy_pass http://admin/; }
    location / { proxy_pass http://mobile; }
  }
}
